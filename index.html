<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Rose Day Aishuu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .bg {
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a0a0f 0%, #000 100%);
        }
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #ff1744;
            border-radius: 50%;
            animation: sparkle 3s infinite;
        }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 23, 68, 0.3);
            border-radius: 30px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(255, 23, 68, 0.4);
            animation: cardGlow 3s ease-in-out infinite;
        }
        @keyframes cardGlow {
            0%, 100% { box-shadow: 0 20px 60px rgba(255, 23, 68, 0.4); }
            50% { box-shadow: 0 20px 80px rgba(255, 23, 68, 0.7); }
        }
        svg {
            width: 300px;
            height: 300px;
            filter: drop-shadow(0 0 20px rgba(255, 23, 68, 0.8));
            animation: roseFloat 4s ease-in-out infinite;
        }
        @keyframes roseFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        .petal-path { 
            fill: url(#petalGradient);
            animation: petalPulse 2s ease-in-out infinite;
        }
        @keyframes petalPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        h1 {
            font-size: 4.5em;
            background: linear-gradient(45deg, #ff1744, #ff6090, #ff1744);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 30px 0 20px;
            animation: gradientShift 3s ease infinite;
            font-weight: bold;
            letter-spacing: 3px;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .name {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 0 0 20px #ff1744, 0 0 40px #ff1744;
            font-weight: bold;
            animation: neonPulse 1.5s ease-in-out infinite;
            letter-spacing: 5px;
        }
        @keyframes neonPulse {
            0%, 100% { text-shadow: 0 0 20px #ff1744, 0 0 40px #ff1744; }
            50% { text-shadow: 0 0 30px #ff1744, 0 0 60px #ff1744, 0 0 80px #ff1744; }
        }
        .hearts-float {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .heart-float {
            position: absolute;
            font-size: 30px;
            animation: floatUp 6s linear infinite;
            opacity: 0;
        }
        @keyframes floatUp {
            0% { bottom: -50px; opacity: 0; transform: translateX(0) rotate(0deg); }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { bottom: 110vh; opacity: 0; transform: translateX(100px) rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="particles" id="particles"></div>
    <div class="hearts-float" id="heartsFloat"></div>
    <div class="container">
        <div class="card">
            <svg viewBox="0 0 200 200">
                <defs>
                    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff1744;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#c2185b;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="stemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#4caf50;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path class="petal-path" d="M100,60 Q85,40 75,50 Q70,60 80,70 Q90,75 100,80 Z">
                    <animate attributeName="d" dur="3s" repeatCount="indefinite"
                        values="M100,60 Q85,40 75,50 Q70,60 80,70 Q90,75 100,80 Z;
                                M100,60 Q85,38 75,50 Q68,60 80,70 Q90,75 100,80 Z;
                                M100,60 Q85,40 75,50 Q70,60 80,70 Q90,75 100,80 Z"/>
                </path>
                <path class="petal-path" d="M100,60 Q115,40 125,50 Q130,60 120,70 Q110,75 100,80 Z">
                    <animate attributeName="d" dur="3s" repeatCount="indefinite"
                        values="M100,60 Q115,40 125,50 Q130,60 120,70 Q110,75 100,80 Z;
                                M100,60 Q115,38 125,50 Q132,60 120,70 Q110,75 100,80 Z;
                                M100,60 Q115,40 125,50 Q130,60 120,70 Q110,75 100,80 Z"/>
                </path>
                <path class="petal-path" d="M100,80 Q75,75 70,85 Q70,95 85,100 Q95,100 100,105 Z"/>
                <path class="petal-path" d="M100,80 Q125,75 130,85 Q130,95 115,100 Q105,100 100,105 Z"/>
                <path class="petal-path" d="M100,80 Q95,95 100,110 Q105,95 100,80 Z"/>
                <circle cx="100" cy="80" r="15" fill="#ffeb3b" opacity="0.9">
                    <animate attributeName="r" values="15;17;15" dur="2s" repeatCount="indefinite"/>
                </circle>
                <rect x="97" y="105" width="6" height="80" fill="url(#stemGradient)" rx="3"/>
                <ellipse cx="85" cy="130" rx="15" ry="8" fill="#4caf50" opacity="0.9">
                    <animateTransform attributeName="transform" type="rotate" from="0 85 130" to="10 85 130" dur="2s" repeatCount="indefinite"/>
                </ellipse>
                <ellipse cx="115" cy="150" rx="15" ry="8" fill="#4caf50" opacity="0.9">
                    <animateTransform attributeName="transform" type="rotate" from="0 115 150" to="-10 115 150" dur="2s" repeatCount="indefinite"/>
                </ellipse>
            </svg>
            <h1>HAPPY ROSE DAY</h1>
            <div class="name">AISHUU</div>
        </div>
    </div>
    <script>
        for(let i=0; i<50; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 3 + 's';
            document.getElementById('particles').appendChild(p);
        }
        setInterval(() => {
            const h = document.createElement('div');
            h.className = 'heart-float';
            h.textContent = '🌹';
            h.style.left = Math.random() * 100 + '%';
            h.style.animationDuration = (Math.random() * 3 + 4) + 's';
            document.getElementById('heartsFloat').appendChild(h);
            setTimeout(() => h.remove(), 6000);
        }, 400);
    </script>
</body>
</html>
